<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Samron Miranda</title>
<meta name="description" content="Contact Samron Trevor Miranda — get in touch.">
<style>
  :root{--bg:#f6fbff;--accent:#0b66ff;--muted:#6b7a90;--card:#fff;--glass:rgba(255,255,255,0.7);--shadow:0 12px 40px rgba(6,18,40,0.08);--rounded:12px}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;background:linear-gradient(180deg,var(--bg),#eaf4ff 60%);color:#102034;-webkit-font-smoothing:antialiased;padding-bottom:60px}
  .container{max-width:900px;margin:0 auto;padding:20px}
  header.nav-wrap{padding:18px 0}
  .nav{display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:700;color:var(--accent);text-decoration:none}
  .nav-links{display:flex;gap:14px;list-style:none;padding:0;margin:0}
  .nav-links a{color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:10px}
  .nav-links a.active{background:var(--glass);color:var(--accent)}

  main.contact-page{padding:22px 0}
  h1{font-size:32px;margin:6px 0}
  p.intro{color:var(--muted)}

  .contact-form{background:linear-gradient(180deg,#fff,#fbfdff);padding:18px;border-radius:12px;box-shadow:var(--shadow);margin-top:12px}
  .contact-form label{display:block;margin-top:12px;font-weight:600}
  .contact-form input,.contact-form textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(2,10,30,0.06);margin-top:6px;font-size:15px}
  .contact-form textarea{resize:vertical}
  .btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--accent);color:white;text-decoration:none;border:0;font-weight:700;margin-top:12px;cursor:pointer}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-msg{margin-top:10px;color:var(--muted)}

  .socials{margin-top:18px}
  .socials a{color:var(--accent);text-decoration:none;font-weight:600}

  /* floating shape */
  .bg-shape{position:fixed;right:-100px;top:10%;width:380px;height:380px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5fb0ff);opacity:0.05;filter:blur(36px);pointer-events:none}

  /* tiny animations */
  .btn.sending{transform:translateY(1px) scale(0.98);opacity:0.9}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* responsive */
  @media (max-width:720px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="bg-shape" aria-hidden></div>
  <header class="nav-wrap">
    <nav class="nav container">
      <a class="brand" href="index.html">Samron Miranda</a>
      <ul class="nav-links" id="nav-links-4">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container contact-page">
    <h1>Contact Me</h1>
    <p class="intro">If you'd like to reach me, send a message using the form below or email me at <a id="mail-link" href="mailto:samronmiranda@gmail.com">samronmiranda@gmail.com</a>. Click the email to copy it.</p>

    <form id="contact-form" class="contact-form" novalidate>
      <div class="form-row">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required aria-required="true" placeholder="Your full name">
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required aria-required="true" placeholder="you@example.com">
        </div>
      </div>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required aria-required="true" placeholder="Tell me a bit about your project or message"></textarea>

      <button type="submit" class="btn" id="sendBtn">Send Message</button>
      <p id="form-msg" class="form-msg" aria-live="polite"></p>
    </form>

    <div class="socials">
      <h3>Connect</h3>
      <p>
        <a href="#" target="_blank" rel="noopener">LinkedIn</a> &middot;
        <a href="#" target="_blank" rel="noopener">GitHub</a> &middot;
        <a href="#" target="_blank" rel="noopener">Instagram</a>
      </p>
    </div>
  </main>

  <footer class="site-footer container">
    <p>&copy; <span id="year-4"></span> Samron Trevor Miranda</p>
  </footer>

<script>
  document.getElementById('year-4').textContent = new Date().getFullYear();

  // copy email on click with feedback
  const mailLink = document.getElementById('mail-link');
  mailLink.addEventListener('click', (e)=>{
    e.preventDefault();
    const email = mailLink.textContent.trim();
    navigator.clipboard?.writeText(email).then(()=>{
      const prev = mailLink.textContent;
      mailLink.textContent = 'Copied!';
      setTimeout(()=> mailLink.textContent = email, 1500);
    }).catch(()=>{ window.location.href = 'mailto:' + email; });
  });

  // simple client-side validation + fake submit (no backend)
  const form = document.getElementById('contact-form');
  const msg = document.getElementById('form-msg');
  const btn = document.getElementById('sendBtn');

  function validate(){
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const message = form.message.value.trim();
    if(!name) return 'Please enter your name.';
    if(!email || !/^\S+@\S+\.\S+$/.test(email)) return 'Please enter a valid email.';
    if(!message || message.length < 10) return 'Message should be at least 10 characters.';
    return '';
  }

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const err = validate();
    if(err){ msg.textContent = err; msg.style.color = 'crimson'; return; }

    // simulate send animation
    btn.classList.add('sending');
    const original = btn.textContent;
    btn.textContent = 'Sending...';
    msg.style.color = 'var(--muted)';
    msg.textContent = 'Sending your message — simulated (no backend).';

    setTimeout(()=>{
      btn.classList.remove('sending');
      btn.textContent = original;
      msg.style.color = 'green';
      msg.textContent = 'Thanks! Your message was "sent" (simulation). I recommend connecting this form to a service like Formspree or Netlify Forms for real submissions.';
      form.reset();
    }, 1200);
  });

  // Accessibility: press Enter on any input to submit
  form.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); form.requestSubmit(); } });
</script>
</body>
</html>
