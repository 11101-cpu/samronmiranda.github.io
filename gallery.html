<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gallery — Samron Miranda</title>
<meta name="description" content="Gallery and portfolio of Samron Miranda.">
<style>
  /* ---------- Theme variables ---------- */
  :root{
    --bg: linear-gradient(180deg,#f6fbff,#eaf4ff 60%);
    --accent:#0b66ff;             /* blue accent used for links, highlights */
    --muted:#6b7a90;             /* muted text (secondary) */
    --card:#ffffff;              /* card surface */
    --shadow:0 8px 28px rgba(12,33,80,0.08);
    --text:#0b66ff;              /* <-- lettering set to blue as requested */
    --glass: rgba(255,255,255,0.92);
    --rounded:12px;
  }

  /* neon-green theme (applied when body.neon) */
  body.neon {
    --bg: linear-gradient(180deg,#eafef0,#e6fff6 60%);
    --accent: #00ff66;          /* accent for things that need to indicate green theme */
    --muted: #08321d;
    --card: #041a10;
    --shadow: 0 18px 50px rgba(0,140,70,0.09);
    --glass: rgba(255,255,255,0.04);
    /* note: --text intentionally NOT changed so lettering stays blue */
  }

  /* ---------- Base (professional) layout ---------- */
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, "Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);                      /* all lettering blue */
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding-bottom:72px;                    /* space for bottom-right button */
    transition:background .35s ease, color .25s ease;
  }

  .container{max-width:1100px;margin:0 auto;padding:28px}
  header.nav-wrap{padding:14px 0}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{font-weight:700;color:var(--accent);text-decoration:none;font-size:18px;letter-spacing:0.2px}
  .menu-toggle{display:none}
  .nav-links{display:flex;gap:14px;list-style:none;padding:0;margin:0}
  .nav-links a{
    color:var(--muted);
    text-decoration:none;
    padding:8px 12px;
    border-radius:10px;
    font-weight:600;
    background:transparent;
    transition:background .18s ease,color .18s ease,transform .12s ease;
  }
  .nav-links a:hover{transform:translateY(-2px)}
  .nav-links a.active{
    background:rgba(11,102,255,0.08);
    color:var(--accent);
    box-shadow:0 6px 18px rgba(11,102,255,0.06);
  }

  /* refined hero */
  h1{font-size:30px;margin:6px 0;color:var(--text);font-weight:800}
  .intro{color:var(--muted);margin-bottom:14px}

  .controls{display:flex;gap:10px;margin:18px 0;align-items:center}
  .filter{
    padding:8px 12px;border-radius:999px;background:transparent;border:1px solid rgba(11,102,255,0.06);cursor:pointer;font-weight:700;color:var(--muted);
  }
  .filter.active{background:var(--accent);color:white;border-color:transparent;box-shadow:0 10px 30px rgba(11,102,255,0.06)}
  .view-count{margin-left:auto;color:var(--muted);font-size:13px}

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
  }
  .thumb{
    width:100%;height:160px;object-fit:cover;border-radius:12px;display:block;cursor:pointer;
    transition:transform .25s ease,box-shadow .25s,filter .18s;
    box-shadow:var(--shadow);border:1px solid rgba(10,20,40,0.03);
    background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0.2));
  }
  .thumb:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 26px 60px rgba(12,33,80,0.12);filter:brightness(1.02)}

  /* card-like modal (clean & minimal) */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,18,40,0.45);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40}
  .modal[aria-hidden="false"]{opacity:1;pointer-events:auto}
  .modal-inner{
    background:var(--card);
    padding:16px;border-radius:14px;max-width:1000px;width:100%;
    box-shadow:0 40px 120px rgba(2,10,30,0.45);
    position:relative;border:1px solid rgba(10,20,40,0.04);
  }
  #modal-img{width:100%;max-height:75vh;object-fit:contain;border-radius:10px}
  .modal-close{position:absolute;right:12px;top:12px;border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer}
  .modal-nav{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;gap:8px}
  .nav-btn{background:var(--glass);border-radius:8px;padding:8px 10px;border:0;cursor:pointer;font-weight:700;color:var(--muted)}

  .caption{margin-top:10px;color:var(--muted);font-size:14px}
  .thumb-strip{display:flex;gap:8px;margin-top:10px;overflow:auto}
  .thumb-strip img{height:56px;width:80px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:0.8;border:1px solid rgba(10,20,40,0.03)}
  .thumb-strip img.active{outline:3px solid var(--accent);opacity:1}

  /* ---------- Game-like loader (polished) ---------- */
  .page-loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
    background:linear-gradient(180deg,#001316,#022826);color:#b8ffd9;z-index:9999;padding:28px;
    font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;
  }

  .loader-inner{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:420px;text-align:center}
  .loader-badge{
    width:92px;height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#002a12,#00522a);box-shadow:0 24px 80px rgba(0,200,110,0.08);
    transform-origin:center;animation: badgePulse 1600ms ease-in-out infinite;border:1px solid rgba(0,255,130,0.06);
  }
  .loader-badge svg{filter:drop-shadow(0 12px 28px rgba(0,255,120,0.09));}

  .loader-title{font-weight:800;letter-spacing:0.8px;color:var(--text)}
  .loader-sub{font-size:13px;color:rgba(255,255,255,0.85)}

  .progress-wrap{width:320px;max-width:100%;height:10px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;box-shadow:inset 0 -6px 18px rgba(0,0,0,0.12)}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00ff66,#00b36a);transition:width .22s linear}

  .dots{display:flex;gap:8px;margin-top:6px}
  .dots span{width:8px;height:8px;border-radius:50%;background:#00ff66;opacity:0;transform:translateY(0);animation: dot 1s infinite}
  .dots span:nth-child(2){animation-delay:.12s}
  .dots span:nth-child(3){animation-delay:.24s}

  @keyframes dot {0%{opacity:0;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(0)}}
  @keyframes badgePulse {0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

  .page-loader.hidden{opacity:0;pointer-events:none;transition:opacity .36s ease;transform:translateY(-6px)}

  /* ---------- Bottom-right theme toggle button ---------- */
  .theme-toggle-br{
    position:fixed;right:20px;bottom:20px;z-index:60;
    background:linear-gradient(90deg,var(--accent),color-mix(in srgb, var(--accent) 40%, #fff 60%));
    color:#fff;border:0;padding:12px 14px;border-radius:12px;font-weight:800;cursor:pointer;
    box-shadow:0 18px 48px rgba(11,102,255,0.14);display:flex;align-items:center;gap:10px;
    transition:transform .12s ease,box-shadow .12s ease,background .25s ease;
  }
  .theme-toggle-br.small{padding:10px 12px;border-radius:999px}
  .theme-toggle-br.neon-style{background:linear-gradient(90deg,#00ff66,#00b36a);box-shadow:0 18px 48px rgba(0,200,110,0.12);color:#00321a}
  .theme-toggle-br:active{transform:translateY(2px);box-shadow:0 10px 26px rgba(0,0,0,0.12)}

  /* professional footer spacing */
  footer.site-footer{padding:26px 0 48px;color:var(--muted);font-size:13px}

  /* responsive */
  @media (max-width:740px){
    .thumb{height:140px}
    .container{padding:18px}
    .theme-toggle-br{right:12px;bottom:12px}
    h1{font-size:22px}
  }
</style>
</head>
<body class="neon">
  <!-- GAME-LIKE LOADER (shows on entry) -->
  <div id="pageLoader" class="page-loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="loader-inner" role="presentation">
      <div class="loader-badge" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="6.5" width="17" height="11" rx="2" stroke="url(#g)" stroke-width="1.2"/>
          <circle cx="12" cy="11.5" r="2.6" stroke="url(#g)" stroke-width="1.2"/>
          <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6affb3"/><stop offset="1" stop-color="#00ff66"/></linearGradient></defs>
        </svg>
      </div>

      <div class="loader-title">SAMRON MIRANDA</div>
      <div class="loader-sub">loading gallery...</div>

      <div class="progress-wrap" aria-hidden="true" title="Loading progress">
        <div id="progressBar" class="progress-bar" style="width:0%"></div>
      </div>

      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="nav-wrap">
    <nav class="nav container" aria-label="Main">
      <a class="brand" href="index.html">Samron Miranda</a>

      <button id="menu-toggle-3" class="menu-toggle" aria-expanded="false" aria-controls="nav-links-3">☰</button>
      <ul class="nav-links" id="nav-links-3" role="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="container gallery-page" id="pageContent" aria-hidden="true">
    <h1>Gallery / Portfolio</h1>
    <p class="intro">A few snapshots of my work, passions and memorable moments.</p>

    <div class="controls">
      <div class="filter active" data-filter="all">All</div>
      <div class="filter" data-filter="projects">Projects</div>
      <div class="filter" data-filter="sports">Sports</div>
      <div class="filter" data-filter="events">Events</div>
      <div class="view-count" id="view-count">4 items</div>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <img class="thumb" src="assets/images/photo1.jpg" alt="Mini Chat App screenshot" data-full="assets/images/photo1_large.jpg" data-tag="projects" loading="lazy">
      <img class="thumb" src="assets/images/photo2.jpg" alt="College sports day" data-full="assets/images/photo2_large.jpg" data-tag="sports" loading="lazy">
      <img class="thumb" src="assets/images/photo3.jpg" alt="Portfolio screenshot" data-full="assets/images/photo3_large.jpg" data-tag="projects" loading="lazy">
      <img class="thumb" src="assets/images/photo4.jpg" alt="Team photo" data-full="assets/images/photo4_large.jpg" data-tag="events" loading="lazy">
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-inner" role="dialog" aria-modal="true" aria-label="Image viewer">
        <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
        <div class="modal-nav">
          <button id="prev" class="nav-btn" aria-label="Previous">◀</button>
          <button id="next" class="nav-btn" aria-label="Next">▶</button>
        </div>
        <img id="modal-img" src="" alt="expanded view">
        <div class="caption" id="modal-caption"></div>
        <div class="thumb-strip" id="thumbStrip" aria-hidden></div>
      </div>
    </div>
  </main>

  <footer class="site-footer container">
    <p>&copy; <span id="year-3"></span> Samron Trevor Miranda</p>
  </footer>

  <!-- Bottom-right theme toggle -->
  <button id="themeToggleBR" class="theme-toggle-br neon-style" aria-pressed="true" title="Switch to white & blue deck">
    <span id="themeIcon">🌿</span>
    <span id="themeLabel">Neon (ON)</span>
  </button>

<script>
  // ---------- Utilities & initial state ----------
  document.getElementById('year-3').textContent = new Date().getFullYear();

  const body = document.body;
  const themeBtnBR = document.getElementById('themeToggleBR');
  const themeIcon = document.getElementById('themeIcon');
  const themeLabel = document.getElementById('themeLabel');

  // apply theme from localStorage (default to neon)
  const stored = localStorage.getItem('samron_theme') || 'neon';
  function applyTheme(name){
    if(name === 'neon'){
      body.classList.add('neon');
      themeBtnBR.classList.add('neon-style');
      themeBtnBR.setAttribute('aria-pressed','true');
      themeIcon.textContent = '🌿';
      themeLabel.textContent = 'Neon (ON)';
      themeBtnBR.title = 'Switch to white & blue deck';
    } else {
      body.classList.remove('neon');
      themeBtnBR.classList.remove('neon-style');
      themeBtnBR.setAttribute('aria-pressed','false');
      themeIcon.textContent = '🔵';
      themeLabel.textContent = 'Original (ON)';
      themeBtnBR.title = 'Switch to neon green deck';
    }
    localStorage.setItem('samron_theme', name);
  }
  applyTheme(stored);

  // Toggle on click
  themeBtnBR.addEventListener('click', ()=>{
    const isNeon = body.classList.contains('neon');
    applyTheme(isNeon ? 'original' : 'neon');
  });

  // ---------- Gallery filters & count ----------
  const filters = document.querySelectorAll('.filter');
  const grid = document.getElementById('galleryGrid');
  const items = Array.from(grid.querySelectorAll('.thumb'));
  const viewCount = document.getElementById('view-count');

  function updateCount(){ viewCount.textContent = items.filter(i => !i.hidden).length + ' items'; }
  updateCount();

  filters.forEach(f=>f.addEventListener('click', ()=>{
    filters.forEach(x=>x.classList.remove('active'));
    f.classList.add('active');
    const tag = f.dataset.filter;
    items.forEach(it => { it.hidden = !(tag === 'all' || it.dataset.tag === tag); });
    updateCount();
  }));

  // ---------- Modal viewer ----------
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const caption = document.getElementById('modal-caption');
  const thumbStrip = document.getElementById('thumbStrip');
  let currentIndex = 0;
  const visibleItems = ()=>Array.from(items).filter(i=>!i.hidden);

  function openAt(index){
    const visible = visibleItems();
    if(visible.length === 0) return;
    currentIndex = ((index % visible.length) + visible.length) % visible.length;
    const target = visible[currentIndex];
    modalImg.src = target.dataset.full || target.src;
    modalImg.alt = target.alt || '';
    caption.textContent = target.alt || '';
    modal.setAttribute('aria-hidden','false');
    buildThumbStrip();
    highlightThumb(currentIndex);
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){ modal.setAttribute('aria-hidden','true'); document.body.style.overflow = ''; }

  items.forEach((it)=> it.addEventListener('click', ()=>{
    const visible = visibleItems();
    const index = visible.indexOf(it);
    openAt(index);
  }));

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('next').addEventListener('click', ()=>{ openAt((currentIndex+1) % visibleItems().length); });
  document.getElementById('prev').addEventListener('click', ()=>{ openAt((currentIndex-1+visibleItems().length) % visibleItems().length); });

  window.addEventListener('keydown', (e)=>{
    if(modal.getAttribute('aria-hidden') === 'false'){
      if(e.key === 'Escape') closeModal();
      if(e.key === 'ArrowRight') document.getElementById('next').click();
      if(e.key === 'ArrowLeft') document.getElementById('prev').click();
    }
  });

  function buildThumbStrip(){
    thumbStrip.innerHTML = '';
    const visible = visibleItems();
    visible.forEach((v,i)=>{
      const t = document.createElement('img');
      t.src = v.src; t.alt = v.alt; t.dataset.index = i;
      if(i === currentIndex) t.classList.add('active');
      t.addEventListener('click', ()=> openAt(i));
      thumbStrip.appendChild(t);
    });
  }

  function highlightThumb(i){
    const thumbs = Array.from(thumbStrip.children);
    thumbs.forEach(t=>t.classList.remove('active'));
    if(thumbs[i]) thumbs[i].classList.add('active');
  }

  // swipe support
  let startX = 0;
  modalImg.addEventListener('touchstart', e=> startX = e.changedTouches[0].clientX);
  modalImg.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 40){ if(dx < 0) document.getElementById('next').click(); else document.getElementById('prev').click(); }
  });
  modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });

  // ---------- Loader logic (game-like UX) ----------
  const loader = document.getElementById('pageLoader');
  const progressBar = document.getElementById('progressBar');
  const pageContent = document.getElementById('pageContent');

  // show loader by default; hide page content for accessibility
  pageContent.setAttribute('aria-hidden','true');

  // simulate progressive loading to look "game-like"
  const imgs = Array.from(document.images);
  let total = imgs.length || 1;
  let loaded = 0;

  function setProgress(p){ progressBar.style.width = Math.min(100, Math.max(0, p)) + '%'; }

  if(imgs.length > 0){
    imgs.forEach(img => {
      if(img.complete) { loaded++; setProgress((loaded/total)*90); }
      else {
        img.addEventListener('load', ()=> { loaded++; setProgress((loaded/total)*90); });
        img.addEventListener('error', ()=> { loaded++; setProgress((loaded/total)*90); });
      }
    });
  } else { loaded = total; setProgress(90); }

  function finishLoader(){
    let current = parseFloat(progressBar.style.width) || 0;
    const step = ()=> {
      current += Math.max(1, (100-current) * 0.18);
      setProgress(current);
      if(current < 99.5) requestAnimationFrame(step);
      else {
        setProgress(100);
        loader.classList.add('hidden');
        setTimeout(()=> {
          if(loader && loader.parentNode) loader.remove();
          pageContent.removeAttribute('aria-hidden');
        }, 420);
        document.body.style.overflow = '';
      }
    };
    requestAnimationFrame(step);
  }

  window.addEventListener('load', ()=> { setTimeout(finishLoader, 300); });
  setTimeout(()=> { if(document.body.contains(loader)) finishLoader(); }, 2200);

  setTimeout(()=> {
    window.addEventListener('keydown', function escHide(e){
      if(e.key === 'Escape' && document.body.contains(loader)) finishLoader();
      window.removeEventListener('keydown', escHide);
    });
  }, 800);

  document.addEventListener('readystatechange', ()=> {
    if(document.readyState === 'complete' && document.body.contains(loader)) finishLoader();
  });

  // ---------- Keep filters count accurate if items change ----------
  const observer = new MutationObserver(updateCount);
  observer.observe(grid, { attributes: true, childList: false, subtree: true, attributeFilter: ['hidden'] });

</script>
</body>
</html>
