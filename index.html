<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Samron Trevor Miranda — Portfolio</title>

  <style>
    :root{
      /* NEON THEME */
      --bg-neon: #39ff14;
      --bg-neon-2: #1bff64;
      --accent-blue: #0b66ff;
      --muted-blue: #2854a8;
      --card:#ffffff;
      --shadow: 0 8px 30px rgba(12,33,80,0.1);
      --body-bg: linear-gradient(180deg,var(--bg-neon),var(--bg-neon-2) 60%);
    }

    /* CLASSIC THEME */
    body.theme-classic{
      --bg-neon: #f8fbff;
      --bg-neon-2: #eaf4ff;
      --accent-blue: #0b66ff;
      --muted-blue: #6b7a90;
      --card:#ffffff;
      --body-bg: linear-gradient(180deg,var(--bg-neon),var(--bg-neon-2) 60%);
    }

    body{
      margin:0;
      background:var(--body-bg);
      font-family:Inter,system-ui;
      color:var(--accent-blue);
      -webkit-font-smoothing:antialiased;
      padding-bottom:40px;
      transition:background .25s ease, color .25s ease;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:22px 28px;
      max-width:1200px;
      margin:0 auto;
    }
    .logo{font-weight:700;font-size:20px;color:var(--accent-blue)}
    nav a{
      text-decoration:none;
      color:var(--muted-blue);
      margin-left:14px;
      padding:8px 10px;
      border-radius:8px;
    }
    nav a:hover{
      background:white;
      color:var(--accent-blue);
    }

    .container{max-width:1200px;margin:0 auto;padding:0 28px}

    .hero{
      margin-top:20px;
      padding:32px;
      background:white;
      border-radius:16px;
      display:grid;
      grid-template-columns:1fr 350px;
      gap:25px;
      box-shadow:var(--shadow);
    }
    .lead{color:var(--muted-blue)}

    /* Profile Photo */
    .profile-section{
      text-align:center;
      margin-top:40px;
    }
    .profile-photo-wrapper{
      width:240px;
      height:240px;
      margin:0 auto;
      border-radius:50%;
      overflow:hidden;
      border:6px solid var(--card);
      box-shadow:0 15px 40px rgba(0,0,0,0.18);
    }
    .profile-photo-wrapper img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    footer{text-align:center;margin-top:40px;color:var(--muted-blue)}

    /* Theme Toggle Button */
    .theme-toggle{
      position:fixed;
      right:22px;
      bottom:22px;
      width:56px;
      height:56px;
      border:none;
      border-radius:50%;
      background:var(--accent-blue);
      color:white;
      cursor:pointer;
      box-shadow:0 8px 25px rgba(0,0,0,0.18);
      font-size:22px;
    }

    @media(max-width:880px){
      .hero{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Samron Miranda</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">

    <section class="hero">
      <div>
        <h1>Hi, I’m <span style="color:var(--accent-blue)">Samron Trevor Miranda</span></h1>
        <p class="lead">Novice coder • Sportsman • Lover of history & tech.</p>
      </div>

      <aside>
        <div style="background:white;padding:18px;border-radius:12px;box-shadow:var(--shadow)">
          <h3>Quick Info</h3>
          <p style="color:var(--muted-blue)">Computer Engineering — FCRIT</p>

          <div style="display:flex;gap:12px;margin-top:12px">
            <div style="background:var(--accent-blue);color:white;padding:10px;border-radius:10px;font-weight:bold">
              Age<br><small>18</small>
            </div>

            <div style="padding:10px;border-radius:10px;background:#eef5ff;color:var(--accent-blue)">
              Hobbies<br><small style="color:var(--muted-blue)">Coding, Sports, Reading</small>
            </div>
          </div>
        </div>
      </aside>
    </section>

    <!-- PROFILE PHOTO SECTION -->
    <section class="profile-section">
      <h2 style="color:var(--accent-blue)">Samron Trevor Miranda</h2>

      <div class="profile-photo-wrapper">
        <img src="assets/sam.jpeg" alt="Profile photo of Samron">
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; <script>document.write(new Date().getFullYear())</script> Samron Trevor Miranda</p>
  </footer>

  <!-- THEME TOGGLE -->
  <button class="theme-toggle" id="themeToggle">♻</button>

  <script>
    const btn = document.getElementById("themeToggle");
    btn.addEventListener("click", ()=>{
      document.body.classList.toggle("theme-classic");
    });
  </script>

</body>
</html>
